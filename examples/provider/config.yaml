apiVersion: v1
kind: Namespace
metadata:
  name: default
---
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: example-provider-secret
type: Opaque
stringData:
  # JSON credentials expected by internal/clients.NewClient:
  #   {"url": "<nagios xi base url>", "token": "<api key>"}
  # The API token is found in the Nagios XI web UI under Admin > API Key.
  credentials: |
    {"url": "http://nagios.example.com/nagiosxi", "token": "REPLACE_ME"}
---
apiVersion: nagios.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: example
  namespace: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: example-provider-secret
      key: credentials
---
apiVersion: nagios.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: example
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: example-provider-secret
      key: credentials
